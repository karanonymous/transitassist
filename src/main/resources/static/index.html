<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TransitAssist</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="banner">
    SIMULATED DEMO: bus positions, crowding and arrival times are generated by the app, not real tracking.
    A stop request is only saved in a database; no driver is notified.
</div>
<div class="layout">
    <div id="map"></div>
    <aside>
        <h1>TransitAssist</h1>

        <section>
            <h2>Routes</h2>
            <ul id="legend" class="plain"></ul>
        </section>

        <section>
            <h2>Selected bus</h2>
            <p id="bus-hint" class="muted">Click a bus on the map.</p>
            <div id="bus-panel" hidden>
                <p id="bus-title" class="strong"></p>
                <p id="bus-detail"></p>
                <label>Boarding stop
                    <select id="stop-select"></select>
                </label>
                <p id="stop-eta" class="muted"></p>
                <button id="request-btn" type="button">Request stop</button>
            </div>
            <p id="request-status" role="status"></p>
        </section>

        <section>
            <h2>Stops near map centre</h2>
            <button id="nearby-btn" type="button">Find nearby stops</button>
            <ul id="nearby" class="plain"></ul>
        </section>

        <section>
            <h2>Recent stop requests</h2>
            <ul id="requests" class="plain"></ul>
        </section>
    </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
