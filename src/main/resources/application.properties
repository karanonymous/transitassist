spring.application.name=transitassist

# NEW database (does not touch any older "transitassist" database). Credentials come from environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:transitassist_map}
spring.datasource.username=${DB_USERNAME:transitapp}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" only ADDS missing tables/columns, never drops. Never use create / create-drop with a real database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never
