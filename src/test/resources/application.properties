# Tests use a throw-away in-memory H2 database (NOT MySQL), so no password and no real data are involved.
# create-drop is safe here only because the database lives in memory and disappears when the tests end.
spring.application.name=transitassist-test
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
